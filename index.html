<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zhang Lab</title>

  <link rel="stylesheet" href="assets/css/home.css">

  <!-- 百度统计：用于后台查看详细访客数据 -->
  <script>
    var _hmt = _hmt || [];

    (function () {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?650296df9166a7be2df862641f76c003";

      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);

  <!-- 不蒜子统计：用于显示网站访问量 -->
  <script
    async
    src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js">

  <!-- 页脚样式 -->
  <style>
    .site-footer {
      margin: 0;
      padding: 22px 5%;
      color: rgba(255, 255, 255, 0.72);
      background:
        linear-gradient(
          135deg,
          #071821 0%,
          #0b2630 55%,
          #0c3038 100%
        );
      border-top: 1px solid rgba(80, 205, 208, 0.28);
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .footer-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-copyright {
      margin: 0;
      line-height: 1.7;
    }

    .footer-lab {
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
    }

    .visitor-statistics {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .visitor-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 20px;
    }

    .visitor-number {
      color: #62d5d4;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 800px) {
      .site-footer {
        padding: 20px;
        text-align: center;
      }

      .footer-inner {
        flex-direction: column;
        gap: 14px;
      }

      .visitor-statistics {
        justify-content: center;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="lab-name">
      <a href="index.html">ZHANG LAB</a>
    </div>

    <nav class="main-nav">
      <a href="research.html">RESEARCH</a>
      <a href="team.html">TEAM</a>
      <a href="publications.html">PUBLICATIONS</a>
      <a href="join-us.html">JOIN US</a>
      <a href="news.html">NEWS</a>
      <a href="contact.html">CONTACT</a>
      <a href="cn/index.html">中文</a>
    </nav>

  </header>

  <main class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>ZHANG LAB</h1>

      <h2>
        Natural Product Discovery, Microbial Interactions
        and Synthetic&nbsp;Biology
      </h2>
    </div>

  </main>

  <footer class="site-footer">

    <div class="footer-inner">

      <p class="footer-copyright">
        <span class="footer-lab">© 2026 Zhang Lab</span><br>
        School of Traditional Chinese Pharmacy,
        China Pharmaceutical University
      </p>

      <div class="visitor-statistics">

        <span id="busuanzi_container_site_pv"
              class="visitor-item">
          Total visits
          <span id="busuanzi_value_site_pv"
                class="visitor-number">—</span>
        </span>

        <span id="busuanzi_container_page_pv"
              class="visitor-item">
          Page visits
          <span id="busuanzi_value_page_pv"
                class="visitor-number">—</span>
        </span>

      </div>

    </div>

  </footer>

</body>
</html>
